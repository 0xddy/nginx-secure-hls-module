# Bind every request to its normalized full path, user and issuance time.
# Replace this demonstration key in both nginx and the PHP issuer.
secure_hls_auth on;
secure_hls_algorithm hmac_sha256;
secure_hls_encoding hex;
secure_hls_token $secure_hls_arg_token;
secure_hls_message "${secure_hls_arg_ukey}\n${secure_hls_arg_t}\n${uri}";
secure_hls_hmac_key demo-hls-secret;
secure_hls_require_args token ukey t;

secure_hls_timestamp $secure_hls_arg_t;
secure_hls_time_mode issued;
secure_hls_ttl 2h;
secure_hls_clock_skew 30s;

# token is generated per URI by resign; it must not be forwarded here.
secure_hls_sign_param token;
secure_hls_sign_message "${secure_hls_arg_ukey}\n${secure_hls_arg_t}\n${secure_hls_target_path}";
secure_hls_sign_playlist_message "${secure_hls_arg_ukey}\n${secure_hls_arg_t}\n${secure_hls_target_path}";
secure_hls_param ukey $secure_hls_arg_ukey;
secure_hls_param pkey $secure_hls_arg_pkey;
secure_hls_param t $secure_hls_arg_t;
