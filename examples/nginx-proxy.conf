load_module modules/ngx_http_secure_hls_module.so;
worker_processes auto;
events { worker_connections 1024; }
http {
    log_format hls '$remote_addr $uri $status $secure_hls_status';
    access_log logs/access.log hls;
    upstream hls_origin { server 127.0.0.1:9000; }
    # Optional raw-source cache, used only in the playlist location below.
    proxy_cache_path cache/hls keys_zone=hls:10m max_size=256m inactive=10m;

    server {
        listen 8080;
        location /upload/hls/ {
            include secure-hls-auth.conf;
            proxy_pass http://hls_origin;
            location ~ \.m3u8$ {
                secure_hls_rewrite on;
                secure_hls_resign on;
                proxy_pass http://hls_origin;
                include secure-hls-proxy-playlist.conf;
                gzip on;
                gzip_types application/vnd.apple.mpegurl application/x-mpegurl;
                # Enable only if the upstream playlist is identical for all users.
                # proxy_cache hls;
                # proxy_cache_key "$scheme$proxy_host$uri";
                # proxy_cache_valid 200 10s;
            }
        }
    }
}
