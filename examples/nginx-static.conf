# Includes are relative to this configuration file; modules/logs use nginx -p.
# For a static build, remove load_module.
load_module modules/ngx_http_secure_hls_module.so;
worker_processes auto;
events { worker_connections 1024; }
http {
    types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t ts;
        video/mp4 mp4 m4s;
        text/vtt vtt;
    }
    default_type application/octet-stream;
    sendfile on;
    log_format hls '$remote_addr $uri $status $secure_hls_status';
    access_log logs/access.log hls;

    server {
        listen 8080;
        root /srv/media;
        location /upload/hls/ {
            include secure-hls-auth.conf;
            # All resources below this path are authenticated, including keys.
            location ~ \.m3u8$ {
                secure_hls_rewrite on;
                secure_hls_resign on;
                gzip on;
                gzip_types application/vnd.apple.mpegurl;
                # secure_hls_allowed_origin https://cdn.example.com;
            }
        }
    }
}
